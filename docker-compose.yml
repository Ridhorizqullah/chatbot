services:
  tanipintar-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tanipintar-bot
    restart: unless-stopped
    depends_on:
      - waha
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-development}
      - WAHA_BASE_URL=http://waha:3000
    volumes:
      # Live code reload untuk mempermudah perbaikan/development tanpa rebuild berulang
      - ./:/app
      - /app/.venv
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - tanipintar-network

  waha:
    image: devlikeapro/waha
    container_name: waha
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Engine & Session Management (Sesuai panduan waha skill)
      - WHATSAPP_DEFAULT_ENGINE=GOWS
      - WHATSAPP_RESTART_ALL_SESSIONS=True
      - WAHA_AUTO_START_DELAY_SECONDS=10
      - WAHA_PRINT_QR=False
      - WAHA_LOG_LEVEL=info
      - WAHA_LOG_FORMAT=JSON
      - TZ=Asia/Jakarta

      # Keamanan API & Dashboard
      - WAHA_DASHBOARD_ENABLED=true
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME:-admin}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD:-}
      - WAHA_DASHBOARD_NO_PASSWORD=${WAHA_DASHBOARD_NO_PASSWORD:-True}
      - WAHA_NO_API_KEY=${WAHA_NO_API_KEY:-True}
      - WAHA_API_KEY=${WAHA_API_KEY:-}

      # Konfigurasi Webhook & Keamanan HMAC
      - WHATSAPP_HOOK_URL=http://tanipintar-bot:8000/webhook/waha
      - WHATSAPP_HOOK_EVENTS=message
      - WHATSAPP_HOOK_HMAC_KEY=${WAHA_HMAC_SECRET:-}
      - WHATSAPP_HOOK_RETRIES_POLICY=exponential
      - WHATSAPP_HOOK_RETRIES_DELAY_SECONDS=2
      - WHATSAPP_HOOK_RETRIES_ATTEMPTS=5

      # Pengelolaan Media
      - WHATSAPP_DOWNLOAD_MEDIA=true
      - WHATSAPP_FILES_LIFETIME=3600
      - WAHA_BASE_URL=http://waha:3000
    volumes:
      - ./waha_data:/app/.sessions
      - waha_files:/tmp/whatsapp-files
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tanipintar-network

volumes:
  waha_files:

networks:
  tanipintar-network:
    driver: bridge
